<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Audio admission gate animation">
<title>Audio admission gate animation</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#111a2e"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
</defs>
<rect width="480" height="270" rx="18" fill="url(#bg)"/>
<rect width="480" height="270" rx="18" fill="url(#grid)" opacity="0.55"/>
<rect x="18" y="18" width="151.0" height="26" rx="13" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.6"/><text x="29" y="36" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#fbbf24">edge ASR gating</text>
<rect x="214" y="78" width="52" height="150" rx="10" fill="#0b1222" stroke="#fbbf24" stroke-width="2"/><text x="240" y="70" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#fbbf24">~1 µs gate</text><rect x="372" y="118" width="88" height="70" rx="12" fill="#0b1222" stroke="#22d3ee" stroke-width="2"/><text x="416" y="150" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#22d3ee">Whisper</text><text x="416" y="171" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#94a3b8">~100s of ms</text>
<g opacity="0"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#34d399" fill-opacity="0.18" stroke="#34d399"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#34d399">speech</text><animateMotion path="M60 153L240 153L312 153" dur="2.40s" begin="0.00s;0.00s+7.5s" fill="freeze" keyPoints="0;0.75;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.40s" begin="0.00s;0.00s+7.5s"/></g>
<g opacity="0"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#f472b6">music</text><animateMotion path="M60 153L240 153L240 250" dur="2.40s" begin="1.50s;1.50s+7.5s" fill="freeze" keyPoints="0;0.75;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.40s" begin="1.50s;1.50s+7.5s"/></g>
<g opacity="0"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#f472b6">noise</text><animateMotion path="M60 153L240 153L240 250" dur="2.40s" begin="3.00s;3.00s+7.5s" fill="freeze" keyPoints="0;0.75;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.40s" begin="3.00s;3.00s+7.5s"/></g>
<g opacity="0"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#34d399" fill-opacity="0.18" stroke="#34d399"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#34d399">speech</text><animateMotion path="M60 153L240 153L312 153" dur="2.40s" begin="4.50s;4.50s+7.5s" fill="freeze" keyPoints="0;0.75;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.40s" begin="4.50s;4.50s+7.5s"/></g>
<g opacity="0"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#f472b6">silence</text><animateMotion path="M60 153L240 153L240 250" dur="2.40s" begin="6.00s;6.00s+7.5s" fill="freeze" keyPoints="0;0.75;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.40s" begin="6.00s;6.00s+7.5s"/></g>
<text x="24" y="250" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">F1 <tspan font-weight="800" fill="#34d399">0.920</tspan>  ·  <tspan font-weight="800" fill="#fbbf24">~33%</tspan> fewer ASR calls</text>
</svg>
